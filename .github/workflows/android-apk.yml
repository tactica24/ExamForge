name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_web_url:
        description: "Public HTTPS URL for the mobile WebView (overrides APP_WEB_URL variable)"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "capacitor.config.json"
      - "www/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app deps for APK build
        run: |
          npm install --omit=dev
          npm run mobile:android:prepare

      - name: Resolve mobile app URL
        id: app_url
        env:
          INPUT_APP_WEB_URL: ${{ github.event.inputs.app_web_url }}
          VAR_APP_WEB_URL: ${{ vars.APP_WEB_URL }}
          VAR_NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          APP_URL="${INPUT_APP_WEB_URL:-$VAR_APP_WEB_URL}"
          APP_URL="${APP_URL:-$VAR_NEXT_PUBLIC_APP_URL}"
          APP_URL="$(echo "$APP_URL" | xargs)"

          if [ -z "$APP_URL" ]; then
            APP_URL="$(node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));console.log(c?.server?.url||'');")"
            APP_URL="$(echo "$APP_URL" | xargs)"
          fi

          case "$APP_URL" in
            ""|"https://your-app.vercel.app"|"https://your-vercel-domain.vercel.app")
              APP_URL=""
              ;;
          esac

          if [ -z "$APP_URL" ]; then
            echo "Missing mobile URL."
            echo "Set repository variable APP_WEB_URL (or NEXT_PUBLIC_APP_URL), or pass workflow input app_web_url."
            echo "Alternatively set server.url in capacitor.config.json to your real deployed domain."
            exit 1
          fi

          if [[ "$APP_URL" != https://* ]]; then
            echo "APP_WEB_URL must start with https://"
            exit 1
          fi

          echo "value=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Set mobile app URL
        env:
          APP_WEB_URL: ${{ steps.app_url.outputs.value }}
        run: |
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.server={ url: process.env.APP_WEB_URL, cleartext:false }; fs.writeFileSync(p, JSON.stringify(c,null,2));"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android assets
        run: |
          if [ -f assets/logo.png ] || [ -f assets/logo.jpg ] || [ -f assets/logo.jpeg ] || [ -f assets/logo.svg ] || [ -f assets/icon.png ] || [ -f assets/icon.svg ]; then
            npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0a0f2c' --splashBackgroundColor '#0a0f2c'
          else
            echo "No icon file found in assets/. Using default Capacitor icon."
          fi

      - name: Sync Android
        run: npm run mobile:android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-naija-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
