name: Cron Jobs

on:
  workflow_dispatch:
    inputs:
      app_web_url:
        description: "Public HTTPS URL for cron endpoints (overrides APP_WEB_URL)"
        required: false
        type: string
  schedule:
    - cron: "5 0 * * 1"

jobs:
  run_crons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate cron configuration
        env:
          INPUT_APP_WEB_URL: ${{ github.event.inputs.app_web_url }}
          APP_WEB_URL: ${{ vars.APP_WEB_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          APP_CRON_SECRET: ${{ secrets.APP_CRON_SECRET }}
        run: |
          APP_URL="${INPUT_APP_WEB_URL:-$APP_WEB_URL}"
          APP_URL="${APP_URL:-$NEXT_PUBLIC_APP_URL}"
          APP_URL="${APP_URL:-https://www.acenaija.com.ng}"
          APP_URL="$(echo "${APP_URL}" | xargs)"

          if [[ "$APP_URL" != https://* ]]; then
            echo "APP_WEB_URL must start with https://"
            exit 1
          fi

          if [ -z "$APP_CRON_SECRET" ]; then
            echo "Missing repository secret APP_CRON_SECRET"
            exit 1
          fi

          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Using APP_URL=$APP_URL"

      - name: Verify app reachable
        run: |
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            "$APP_URL/api/health"

      - name: Run leaderboards cron
        env:
          APP_CRON_SECRET: ${{ secrets.APP_CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -H "x-cron-secret: $APP_CRON_SECRET" \
            "$APP_URL/api/cron/leaderboards"
